<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página não encontrada | Paola Schubert</title>
  <meta name="description" content="A página que você procura não foi encontrada.">
  <!-- url-meta:inicio estado=demonstracao -->
  <meta name="robots" content="noindex, nofollow">
  <!-- url-meta:fim -->
  <style>
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#fbf7f2;color:#1d1026;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center}
    main{max-width:520px}
    .code{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:4.5rem;color:#841cb4;line-height:1;margin:0}
    h1{font-family:Georgia,"Times New Roman",serif;font-size:1.9rem;margin:.6rem 0 1rem}
    p{color:#5b5063;line-height:1.6;margin:0 0 1.6rem}
    a{display:inline-block;background:#841cb4;color:#fff;text-decoration:none;font-weight:700;padding:14px 26px;border-radius:999px}
    a:hover{background:#5c1580}
    a:focus-visible{outline:3px solid #1d1026;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">404</p>
    <h1>Esta página não foi encontrada</h1>
    <p>O endereço pode ter mudado ou não existe mais. Volte ao início para conhecer as mentorias da Paola Schubert.</p>
    <a id="home" href="/">Voltar ao início</a>
  </main>
  <script>
    (function () {
      var h = location.hostname, p = location.pathname.split('/').filter(Boolean);
      var a = document.getElementById('home');
      a.href = /\.github\.io$/.test(h) && p.length ? '/' + p[0] + '/' : '/';
    })();
  </script>
</body>
</html>
